[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
compiler = { path = "../compiler" }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3.100", features = [
  "console",
  "Window",
  "Performance",
] }
js-sys = "0.3.100"

[lib]
crate-type = ["cdylib"]
