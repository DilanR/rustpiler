[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.17"
anyhow = "1.0.100"
clap = { version = "4.5.0", features = ["derive"] }
compiler = { path = "../compiler", default-features = false }

